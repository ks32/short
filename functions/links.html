<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link id="favicon" rel="icon" href="asset/img/favicon.png" type="image/png">
  <title>All Links</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f9f9f9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
      min-width: 800px;
    }

    th,
    td {
      padding: 1rem;
      border: 1px solid #eaeaea;
      text-align: left;
    }

    th {
      background: #f1f3f5;
    }

    caption {
      margin-bottom: 1rem;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .search-box input {
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 300px;
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pagination-controls select {
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .pagination-controls button {
      background: #5c7cfa;
      border: none;
      color: white;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 1rem;
    }

    .pagination-controls button:hover:enabled {
      background: #4263eb;
    }

    .pagination-controls button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .pagination-controls button svg {
      vertical-align: middle;
      width: 1em;
      height: 1em;
      fill: white;
    }

    h1{
      text-align: center;
    }
  </style>
</head>

<body>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const hostname = window.location.hostname;
      const favicon = document.getElementById("favicon");

      let logoPath = "asset/img/pdms-logo.png";

      if (hostname === "g.quranmajeed.com") {
        logoPath = "asset/img/qm-logo.png";
      } else if (hostname === "g.kitabi.pk") {
        logoPath = "asset/img/kitabi-logo.webp";
      } else if (hostname === "e.pakdata.com") {
        logoPath = "asset/img/easyurdu-logo.jpg";
      }
      favicon.href = logoPath;
    });
  </script>

  <!-- Toolbar with search, limit, and pagination -->

    <h1 class="text-center">All Short Link List</h1>
  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search by slug or URL..." />
    </div>
  </div>

  <!-- Table -->
  <table id="links-table">
    <thead>
      <tr>
        <th>Slug</th>
        <th>Original URL</th>
        <th>Short Link</th>
        <th>Total Clicked</th>
        <th>Domain</th>
        <th>Created By</th>
        <th>Created Time</th>
      </tr>
    </thead>
    <tbody></tbody>
    <tfoot>
      <tr>
        <td colspan="6" id="table-footer" style="text-align: right; font-weight: bold; padding-top: 1rem;"></td>
      </tr>
    </tfoot>
  </table>

  <div style="justify-content: end; display: flex; margin-top: 10px;">
    <div class="pagination-controls">
      <label for="limit-select">Rows:</label>
      <select id="limit-select">
        <option value="20">20</option>
        <option value="75">75</option>
        <option value="100">100</option>
      </select>
      <button id="prev-btn" disabled title="Previous">
        <svg viewBox="0 0 20 20">
          <path d="M13 15l-5-5 5-5v10z" />
        </svg>
      </button>
      <button id="next-btn" disabled title="Next">
        <svg viewBox="0 0 20 20">
          <path d="M7 5l5 5-5 5V5z" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    let page = 0;
    let limit = 50;
    let totalCount = 0;
    let searchTerm = '';
  
    const pageCache = {}; // key = `${searchTerm}|${limit}|${page}`
  
    const tbody = document.querySelector('#links-table tbody');
    const footer = document.getElementById('table-footer');
    const limitSelect = document.getElementById('limit-select');
    const searchInput = document.getElementById('search-input');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
  
    async function fetchLinksFromAPI(page, limit, search = '') {
      const res = await fetch(`/linklist?page=${page}&limit=${limit}&search=${encodeURIComponent(search)}`);
      return await res.json();
    }
  
    async function fetchTotalCount(search = '') {
      const res = await fetch(`/linkcount?search=${encodeURIComponent(search)}`);
      const { count } = await res.json();
      return count;
    }
  
    async function renderTable() {
      tbody.innerHTML = "";
      const cacheKey = `${searchTerm}|${limit}|${page}`;
      let data = [];
  
      if (pageCache[cacheKey]) {
        data = pageCache[cacheKey];
      } else {
        data = await fetchLinksFromAPI(page, limit, searchTerm);
        pageCache[cacheKey] = data;
      }
  
      const start = page * limit + 1;
      const end = Math.min(start + data.length - 1, totalCount);
  
      data.forEach(link => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${link.slug}</td>
          <td><a href="${link.url}" target="_blank">${link.url}</a></td>
          <td><a href="${link.domain}/${link.slug}" target="_blank">${window.location.origin}/${link.slug}</a></td>
          <td>${link.opened}</td>
          <td>${link.domain}</td>
          <td>${link.created_by}</td>
          <td>${link.create_time}</td>
        `;
        tbody.appendChild(tr);
      });
  
      footer.textContent = `${start} - ${end} of ${totalCount}`;
      prevBtn.disabled = page === 0;
      nextBtn.disabled = end >= totalCount;
    }
  
    function pageCacheReset() {
      for (let key in pageCache) delete pageCache[key];
    }
  
    limitSelect.addEventListener('change', async () => {
      limit = parseInt(limitSelect.value);
      page = 0;
      pageCacheReset();
      totalCount = await fetchTotalCount(searchTerm);
      renderTable();
    });
  
    searchInput.addEventListener('input', async () => {
      page = 0;
      searchTerm = searchInput.value.trim();
      pageCacheReset();
      totalCount = await fetchTotalCount(searchTerm);
      renderTable();
    });
  
    prevBtn.addEventListener('click', () => {
      if (page > 0) {
        page--;
        renderTable();
      }
    });
  
    nextBtn.addEventListener('click', () => {
      page++;
      renderTable();
    });
  
    // Initial load
    (async () => {
      totalCount = await fetchTotalCount();
      renderTable();
    })();
  </script>
  
</body>

</html>
